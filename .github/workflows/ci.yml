# CI for pushes to main, version tags and pull requests, on GitHub-hosted runners only: pull
# requests from forks run untrusted code, which never goes near a self-hosted machine. Jobs don't
# rely on state from earlier runs or claim fixed host ports: Testcontainers maps every container
# port to a random host port, and the smoke stack publishes no port at all and is named per run.
#
# The docker job builds the open-source image on every run and, for pushes to main and v* tags
# only, publishes it to ghcr.io/draggable/openrows (docker/ghcr.sh: :sha-<commit>, :main while the
# commit is main's tip, and :<tag> for a tag).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push to a PR replaces its older run; every commit on main gets its own verdict.
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The chart's lint and golden template tests (deploy/helm/test/chart.test.ts, in `npm test`)
      # need the pinned Helm, checked against the sums in install-tools.sh.
      - name: Install Helm
        run: |
          deploy/helm/install-tools.sh "$RUNNER_TEMP/helm-bin" helm
          echo "$RUNNER_TEMP/helm-bin" >> "$GITHUB_PATH"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # What the npm packages (sdk, mcp-server, n8n nodes, blocks) would ship: `npm pack
      # --dry-run` holds only dist, README, LICENSE and package.json, with no source maps,
      # sources, tests, fixtures, .env files or local paths, and publishable manifests.
      - name: Published packages check
        run: npm run check:packages
      - name: Migration drift check (schema.ts and drizzle/ must agree)
        run: npm run db:check
      # Redocly's recommended rules over the document /api/openapi.json serves.
      - name: OpenAPI lint
        run: npm run lint:openapi
      # Includes the `docker` project: the Keycloak realm contract and the Compose tests
      # (docker/test/compose.test.ts), which render `docker compose config`. They need the Docker
      # CLI with Compose v2, not a running stack, and fail rather than skip under CI.
      - name: Unit and Compose config tests with coverage
        run: npm run test:coverage

  integration:
    # Needs Docker: Testcontainers starts Postgres 16, Redis and Mailpit. The global setup pulls
    # and checks every image first (packages/server/test/helpers/images.ts).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The server imports @openrows/shared from its dist/.
      - run: npm run build -w @openrows/shared
      - run: npm run test:integration

  smoke:
    # The whole Compose stack (docker/ci.yml: the dev stack with Keycloak, no host ports) and the
    # Playwright suite inside it: the client loads, /health, /ready, /auth/login redirects to
    # Keycloak and the dev user signs in, the golden path, the seeded demo and the specs against a
    # mocked API. Sharded: each shard is its own job with its own stack, project
    # openrows-ci-<run>-<attempt>-<shard>, always torn down.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    # Room for a slow stack start (up to the 11 min wait below) on top of the build, npm ci,
    # Playwright and the teardown.
    timeout-minutes: 40
    env:
      OPENROWS_CI_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
      IMAGE: openrows:ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # The e2e container runs @playwright/test from this node_modules. Its browsers come with
      # the Playwright image (pinned in docker/ci.yml to the same version, which the compose
      # tests check).
      - run: npm ci --no-audit --no-fund
      # e2e/seed.spec.ts runs the seed CLI (packages/server/dist/seed/cli.js) from the checkout.
      - run: npm run build -w @openrows/shared -w @openrows/server
      - name: Build the image
        run: >-
          docker buildx build -f docker/Dockerfile --target oss -t "$IMAGE"
          --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          --label org.opencontainers.image.revision=${{ github.sha }} .
      # Keycloak's CI healthcheck (docker/ci.yml) allows ~9 min before it reports unhealthy; the
      # wait outlasts it, so a failure is the healthcheck's verdict, with logs.
      - name: Start the stack
        run: docker/compose.sh ci up -d --wait --wait-timeout 660 --no-build
      - name: Playwright against the stack (shard ${{ matrix.shard }} of 2)
        run: >-
          E2E_UID="$(id -u)" E2E_GID="$(id -g)" docker/compose.sh ci run --rm --no-deps e2e
          npx --no-install playwright test --shard=${{ matrix.shard }}/2
      - name: Stack status and logs
        if: failure()
        run: |
          docker/compose.sh ci ps -a
          docker/compose.sh ci logs --no-color --tail 300
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      # always() also runs when the job fails, times out or is cancelled.
      - name: Tear down the stack
        if: always()
        run: |
          docker/compose.sh ci --profile e2e down -v --remove-orphans --timeout 20 || true
          docker image rm "$IMAGE" || true

  docker:
    # Builds docker/Dockerfile's `oss` target after every other job passed. On a push to main or
    # a v* tag (only) it pushes it to GHCR. Pull requests only build.
    needs: [check, integration, smoke, helm]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # packages: write for this job only; no step of a pull request run uses the token.
    permissions:
      contents: read
      packages: write
    env:
      LOCAL_IMAGE: openrows:ci-${{ github.run_id }}-${{ github.run_attempt }}-docker
      REPO_IMAGE: ghcr.io/draggable/openrows
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the image (oss target)
        run: >-
          docker buildx build -f docker/Dockerfile --target oss -t "$LOCAL_IMAGE"
          --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          --label org.opencontainers.image.revision=${{ github.sha }}
          --label org.opencontainers.image.licenses=AGPL-3.0-only .
      - name: Push the image to GHCR
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker/ghcr.sh push "$LOCAL_IMAGE" "$REPO_IMAGE" "$GITHUB_SHA"
      # A release tag (v1.0.0) also names the image: ghcr.io/draggable/openrows:v1.0.0.
      - name: Tag the release image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          config="$(mktemp -d)"
          trap 'rm -rf "$config"' EXIT
          printf '%s' "$GH_TOKEN" | docker --config "$config" login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker --config "$config" buildx imagetools create \
            -t "$REPO_IMAGE:$GITHUB_REF_NAME" "$REPO_IMAGE:sha-$GITHUB_SHA"
      - name: Remove the local tag
        if: always()
        run: docker image rm "$LOCAL_IMAGE" 2>/dev/null || true

  helm:
    # The Helm chart installed for real: a throwaway kind cluster per run, the `oss` image loaded
    # into it, the chart with its bundled Postgres and an in-cluster S3, `helm test`, an upgrade
    # through the pre-upgrade migrate hook and `helm test` again (deploy/helm/test/kind-smoke.sh).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: openrows-helm:ci-${{ github.run_id }}-${{ github.run_attempt }}
      KIND_CLUSTER: openrows-helm-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Helm and kind
        run: |
          deploy/helm/install-tools.sh "$RUNNER_TEMP/helm-bin" helm kind
          echo "$RUNNER_TEMP/helm-bin" >> "$GITHUB_PATH"
      - name: Build the image (oss target)
        # No attestations: `kind load` copies a plain image.
        run: docker buildx build -f docker/Dockerfile --target oss --provenance=false --sbom=false -t "$IMAGE" .
      - name: Install the chart in kind
        run: deploy/helm/test/kind-smoke.sh
      - name: Remove the cluster and the image
        if: always()
        run: |
          kind delete cluster --name "$KIND_CLUSTER" || true
          docker image rm "$IMAGE" || true
