# Source: openrows/templates/postgresql.yaml
# The bundled Postgres 16 (one replica, a PersistentVolumeClaim). The migrate Job connects as its
# superuser; the api and worker as openrows_app, which row-level security applies to (ADR-002).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openrows-postgresql
  labels:
    helm.sh/chart: openrows-0.1.0
    app.kubernetes.io/name: openrows
    app.kubernetes.io/instance: openrows
    app.kubernetes.io/component: postgresql
    app.kubernetes.io/version: "0.5.0"
    app.kubernetes.io/part-of: openrows
    app.kubernetes.io/managed-by: Helm
spec:
  serviceName: openrows-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openrows
      app.kubernetes.io/instance: openrows
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openrows
        app.kubernetes.io/instance: openrows
        app.kubernetes.io/component: postgresql
    spec:
      automountServiceAccountToken: false
      # The image's postgres user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgresql
          image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "openrows"
            - name: POSTGRES_USER
              value: "openrows"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openrows-secrets
                  key: POSTGRES_PASSWORD
            # A subdirectory: the volume's root may hold lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi

