# Source: openrows/templates/valkey.yaml
# Valkey with a password, no persistence (nothing in OpenRows keeps state there yet). The api's
# REDIS_URL points here and /ready checks it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openrows-valkey
  labels:
    helm.sh/chart: openrows-0.1.0
    app.kubernetes.io/name: openrows
    app.kubernetes.io/instance: openrows
    app.kubernetes.io/component: valkey
    app.kubernetes.io/version: "0.5.0"
    app.kubernetes.io/part-of: openrows
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openrows
      app.kubernetes.io/instance: openrows
      app.kubernetes.io/component: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openrows
        app.kubernetes.io/instance: openrows
        app.kubernetes.io/component: valkey
    spec:
      automountServiceAccountToken: false
      # The alpine image's valkey user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: valkey/valkey:8.1.10-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "exec valkey-server --save '' --appendonly no --requirepass \"$VALKEY_PASSWORD\""]
          ports:
            - name: valkey
              containerPort: 6379
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rows
                  key: VALKEY_PASSWORD
          readinessProbe:
            exec:
              command: ["sh", "-c", "valkey-cli --no-auth-warning -a \"$VALKEY_PASSWORD\" ping | grep -q PONG"]
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "valkey-cli --no-auth-warning -a \"$VALKEY_PASSWORD\" ping | grep -q PONG"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}

