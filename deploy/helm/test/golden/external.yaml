# Source: openrows/templates/migrate-job.yaml
# The migrations (node dist/migrate.js: Drizzle's, then the job queue's schema, then the
# openrows_app password), under an advisory lock, so a second run waits and then skips.
# On install it is a plain Job, started with the bundled Postgres it needs, and the api and worker
# wait for it (their wait-for-migrations init container). On upgrade it is a pre-upgrade hook:
# the migrations run before any pod of the new release starts, and a failure stops the upgrade.
# The name carries the revision because a Job's pod template can't change.
apiVersion: batch/v1
kind: Job
metadata:
  name: openrows-migrate-1
  labels:
    helm.sh/chart: openrows-0.1.0
    app.kubernetes.io/name: openrows
    app.kubernetes.io/instance: openrows
    app.kubernetes.io/component: migrate
    app.kubernetes.io/version: "0.5.0"
    app.kubernetes.io/part-of: openrows
    app.kubernetes.io/managed-by: Helm
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openrows
        app.kubernetes.io/instance: openrows
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: openrows
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: registry
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Waits for Postgres to accept the owner's connection (the bundled one starts with it).
        - name: wait-for-postgres
          image: registry.example.org/openrows@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          imagePullPolicy: IfNotPresent
          command:
            - node
            - -e
            - |
              const pg = require('pg');
              (async () => {
                for (;;) {
                  const client = new pg.Client({ connectionString: process.env.MIGRATION_DATABASE_URL, connectionTimeoutMillis: 5000 });
                  try {
                    await client.connect();
                    await client.query('SELECT 1');
                    process.exit(0);
                  } catch {
                    console.log('Waiting for Postgres');
                  } finally {
                    await client.end().catch(() => {});
                  }
                  await new Promise((resolve) => setTimeout(resolve, 3000));
                }
              })();
          env:
            - name: MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rows
                  key: MIGRATION_DATABASE_URL
            - name: OPENROWS_APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rows
                  key: OPENROWS_APP_DB_PASSWORD
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
      containers:
        - name: migrate
          image: registry.example.org/openrows@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/migrate.js"]
          env:
            # Production refuses a default or placeholder OPENROWS_APP_DB_PASSWORD.
            - name: NODE_ENV
              value: production
            - name: MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rows
                  key: MIGRATION_DATABASE_URL
            - name: OPENROWS_APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rows
                  key: OPENROWS_APP_DB_PASSWORD
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
