          ports:
            - name: http
              containerPort: 3000
            - name: metrics
              containerPort: 9464
          envFrom:
            - configMapRef:
                name: openrows
          env:
            - name: PORT
              value: "3000"
            # GET /metrics for Prometheus on its own port, which the Service doesn't expose.
            - name: METRICS_PORT
              value: "9464"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rows
                  key: DATABASE_URL
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: rows
                  key: ENCRYPTION_KEY
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rows
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rows
                  key: S3_SECRET_KEY
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rows
                  key: OIDC_CLIENT_SECRET
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rows
                  key: VALKEY_PASSWORD
            - name: REDIS_URL
              value: "redis://:$(VALKEY_PASSWORD)@openrows-valkey:6379"
            - name: TURNSTILE_SITE_KEY
              value: "0x4AAAAAAAsite"
            - name: TURNSTILE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rows
                  key: TURNSTILE_SECRET_KEY
            - name: AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rows
                  key: AI_API_KEY
                  optional: true
          # /health: the process serves (never touches dependencies). /ready: Postgres, S3 (and
          # Redis when set) answer; a pod that can't reach them gets no traffic.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # The root filesystem is read-only; scratch space only.
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi

