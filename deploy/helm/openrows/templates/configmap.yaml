{{- include "openrows.validate" . -}}
{{- $v := .Values -}}
# The api's and worker's non-secret settings (.env.example documents each). Secrets never go
# here: they come from the existing Secret (values.yaml, existingSecret).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openrows.fullname" . }}
  labels:
    {{- include "openrows.labels" (dict "root" . "component" "config") | nindent 4 }}
data:
  NODE_ENV: production
  LOG_LEVEL: {{ $v.logLevel | quote }}
  APP_URL: {{ $v.appUrl | quote }}
  TRUST_PROXY: {{ $v.trustProxy.enabled | quote }}
  TRUST_PROXY_HOPS: {{ $v.trustProxy.hops | quote }}
  OIDC_ISSUER_URL: {{ $v.oidc.issuerUrl | quote }}
  OIDC_CLIENT_ID: {{ $v.oidc.clientId | quote }}
  {{- with $v.oidc.authProviders }}
  AUTH_PROVIDERS: {{ . | quote }}
  {{- end }}
  S3_ENDPOINT: {{ $v.s3.endpoint | quote }}
  S3_REGION: {{ $v.s3.region | quote }}
  S3_BUCKET: {{ $v.s3.bucket | quote }}
  {{- with $v.s3.publicUrl }}
  S3_PUBLIC_URL: {{ . | quote }}
  {{- end }}
  {{- with $v.smtp.host }}
  SMTP_HOST: {{ . | quote }}
  SMTP_PORT: {{ $v.smtp.port | quote }}
  SMTP_SECURE: {{ $v.smtp.secure | quote }}
  {{- with $v.smtp.user }}
  SMTP_USER: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- with $v.smtp.from }}
  SMTP_FROM: {{ . | quote }}
  {{- end }}
  {{- with $v.ai.baseUrl }}
  AI_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- with $v.ai.model }}
  AI_MODEL: {{ . | quote }}
  {{- end }}
  {{- with $v.ai.allowedHosts }}
  AI_ALLOWED_HOSTS: {{ . | quote }}
  {{- end }}
  {{- with $v.systemAdmins }}
  OPENROWS_SYSTEM_ADMINS: {{ . | quote }}
  {{- end }}
  {{- with $v.statusPageUrl }}
  STATUS_PAGE_URL: {{ . | quote }}
  {{- end }}
  OUTBOUND_HTTP_ALLOW_HTTP: {{ $v.outbound.allowHttp | quote }}
  {{- with $v.outbound.ports }}
  OUTBOUND_HTTP_PORTS: {{ . | quote }}
  {{- end }}
  {{- with $v.outbound.allow }}
  OUTBOUND_HTTP_ALLOW: {{ . | quote }}
  {{- end }}
  {{- with $v.outbound.deny }}
  OUTBOUND_HTTP_DENY: {{ . | quote }}
  {{- end }}
  {{- range $name, $value := $v.extraEnv }}
  {{ $name }}: {{ $value | toString | quote }}
  {{- end }}
