{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openrows.serviceAccountName" . }}
  labels:
    {{- include "openrows.labels" (dict "root" . "component" "serviceaccount") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# OpenRows never talks to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
